apiVersion: v1
kind: Secret
metadata:
  name: weather-agent-secrets
  namespace: weather-agent
  labels:
    app: weather-agent
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: weather-agent
type: Opaque
stringData:
  # MCP Server Configuration
  MCP_URL: "${MCP_URL}"  # URL to the MCP server endpoint
  MCP_TIMEOUT: "${MCP_TIMEOUT}"  # Timeout in seconds for MCP requests

  # LLM Configuration
  LLM_URL: "${LLM_URL}"  # LLM API endpoint URL
  LLM_API_KEY: "${LLM_API_KEY}"  # API key for LLM authentication
  LLM_MODEL_NAME: "${LLM_MODEL_NAME}"  # Model name to use for LLM requests

  # Redis Configuration (optional)
  REDIS_PASSWORD: "${REDIS_PASSWORD}"  # Redis password if authentication is enabled

  # API Security
  API_SECRET_KEY: "${API_SECRET_KEY}"  # Secret key for API JWT tokens