apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-agent-redis
  labels:
    app: weather-agent
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: weather-agent
    app.openshift.io/runtime: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-agent
      component: redis
  template:
    metadata:
      labels:
        app: weather-agent
        component: redis
        app.kubernetes.io/name: weather-agent
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: weather-agent
    spec:
      containers:
      - name: redis
        image: docker.io/redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /var/lib/redis/data
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather-agent-redis
  labels:
    app: weather-agent
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: weather-agent
spec:
  selector:
    app: weather-agent
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP