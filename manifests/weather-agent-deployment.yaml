apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-agent
  namespace: weather-agent
  labels:
    app: weather-system
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-system
      component: api
  template:
    metadata:
      labels:
        app: weather-system
        component: api
    spec:
      containers:
      - name: weather-agent
        image: image-registry.openshift-image-registry.svc:5000/weather-agent/weather-agent:latest
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: ENV
          value: "development"
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MCP_URL
          value: "https://mcp-server-weather-mcp.apps.cluster-sdzgj.sdzgj.sandbox319.opentlc.com"
        envFrom:
        - secretRef:
            name: weather-agent-secrets
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: weather-agent
  namespace: weather-agent
  labels:
    app: weather-system
    component: api
spec:
  selector:
    app: weather-system
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP