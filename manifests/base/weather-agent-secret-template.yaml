apiVersion: v1
kind: Secret
metadata:
  name: weather-agent-secrets
  namespace: weather-agent
  labels:
    app: weather-agent
    component: secrets
type: Opaque
stringData:
  # LLM Configuration
  LLM_URL: "YOUR_LLM_URL_HERE"
  LLM_MODEL_NAME: "YOUR_LLM_MODEL_NAME_HERE"
  LLM_API_KEY: "YOUR_LLM_API_KEY_HERE"

  # MCP Configuration
  MCP_URL: "YOUR_MCP_SERVER_URL_HERE"
  MCP_TIMEOUT: "30"
  MCP_TRANSPORT: "streaming-http"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379"

  # Application Configuration
  ENV: "development"
  LOG_LEVEL: "INFO"
  LOG_REQUESTS: "true"
  LOG_REQUEST_BODY: "true"
  LOG_RESPONSE_BODY: "false"
  ACCESS_LOG: "true"

  # CORS Configuration
  CORS_ORIGINS: "*"

  # OpenTelemetry Configuration (Optional - uncomment if using)
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  # OTEL_EXPORTER_OTLP_HEADERS: "api-key=your-api-key"
  # OTEL_SERVICE_NAME: "weather-agent"