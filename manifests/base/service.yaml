apiVersion: v1
kind: Service
metadata:
  name: weather-agent
  labels:
    app: weather-agent
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: weather-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: weather-agent-tls
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: weather-agent
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800